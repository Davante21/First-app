name: Record Genuine Flutter Web App

on:
  push:
    branches: [flutter-gems-calculator-demo]
    paths:
      - .github/workflows/flutter-web-recording.yml
      - flutter_gems_calculator/web_capture.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-record:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.3.10"
          channel: stable
          cache: true
      - name: Install browser recording tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p recordings
      - name: Clone upstream Flutter app and enable Web target
        run: |
          git clone --depth 1 https://github.com/belelaritra/Neumorphic_Calculator.git upstream_web
          cd upstream_web
          flutter create --platforms=web .
          flutter pub get
          flutter build web --release --web-renderer html
      - name: Start local web server
        run: |
          nohup python3 -m http.server 8000 --directory upstream_web/build/web > /tmp/flutter-web-server.log 2>&1 &
          sleep 3
      - name: Record original Flutter app
        run: node flutter_gems_calculator/web_capture.js original
      - name: Add Davante label and rebuild
        run: |
          cp flutter_gems_calculator/overrides/lib/src/ui/calculation_display.dart upstream_web/lib/src/ui/calculation_display.dart
          cd upstream_web
          flutter build web --release --web-renderer html
      - name: Record customized Flutter app
        run: node flutter_gems_calculator/web_capture.js customized
      - name: Record reported bug interaction before fix
        run: node flutter_gems_calculator/web_capture.js bug_before
      - name: Apply bug fix and compile
        run: |
          cp flutter_gems_calculator/overrides/lib/src/utils/button_press.dart upstream_web/lib/src/utils/button_press.dart
          cd upstream_web
          flutter build web --release --web-renderer html
      - name: Record bug interaction after fix
        run: node flutter_gems_calculator/web_capture.js bug_after
      - name: Upload screen recordings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-calculator-final-video-evidence
          path: recordings/
          if-no-files-found: warn
